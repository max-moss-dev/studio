[package]
name = "studio"
version = "0.1.0"
description = "Studio — AI Agent Management Platform"
authors = ["Studio Team"]
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portpicker = "0.1"
